<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <header>
        

        <nav class="bg-gray-800 p-4">
            <div class="flex justify-between text-center items-center">
                <a href="index.html" class="text-white text-lg justify-start">Accueil</a>
                <h1 class="text-white text-xl mr-8 ml-8 mt-4 mb-4 flex items-center justify-center">Quizz</h1>
                <div class="md:hidden">
                    <button id="burger" class="text-white focus:outline-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                        </svg>
                    </button>
                </div>
                <ul class="hidden md:flex space-x-4 justify-end">
                  
                    <li><a href="#" class="text-white">Thème</a></li>
                    <li><a href="index.html" class="text-white">Inscription</a></li>
                </ul>
            </div>
             
            <ul id="menu" class="hidden md:hidden flex flex-col space-y-2 mt-4">
                <div class="border border-red-600 "></div> 
                <li><a href="#" class="text-white block mt-1">Thème</a></li>
                <li><a href="index.html" class="text-white block">Inscription</a></li>
            </ul>
        </nav>
        
    </header>
    <main class="border border-blue-500 m-5 bg-stone-100">

        <article class="">
            <section class="grid justify-center border border-blue-500 m-5">
                <div class="m-5 grid justify-center" id="question-container">
                    Questions du quiz ici :
                </div>
            </section>
            <section class="border border-red-500 mr-16 ml-16"></section>
            <section class="grid justify-center border border-blue-500 m-5">
                <div class="m-5 grid justify-center" id="reponse-container">
                    Réponses du quizz ici
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                </div>
            </section>
            <section class="border border-blue-500 m-5 text-center">
                Bonne ou mauvaise réponse affiché ici
            </section>
        </article>

        <article class="flex flex-col  md:flex-row m-5 justify-center items-center">
            <section class="flex flex-col items-start m-5 ">
                <section>Difficulté du thèmee :</section>
                <section>Difficulté de la question :</section>
                <section>Nombre de questions : (quelle question on est)</section>
                <section>compteur bonne réponse : exemple 5/10 voir %</section>
            </section>

<!-- Probléme pour cenrer le bouton -->
            <button  
                class="m-16 flex flex-row justify-center text-center md:size-2/12 items-center rounded text-white bg-blue-600 hover:bg-sky-700 active:bg-violet-700 focus:outline-none focus:ring focus:ring-violet-300 px-6 pb-2 pt-2.5"
                type="submit" id="suivant">
                Suivant
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path class="text-white" stroke-linecap="round" stroke-linejoin="round"
                        d="m9 12.75 3 3m0 0 3-3m-3 3v-7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                </svg>
            </button>
        </article>
    </main>



         



    <script src="main.js"></script>
</body>

</html>
